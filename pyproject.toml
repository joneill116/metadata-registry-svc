[tool.poetry]
name = "metadata-registry-svc"
version = "0.1.0"
description = "Metadata registry service for distributed workflow platform."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
pydantic = "^2.7.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
domain-repository = "^0.1.0"
requests = "^2.32.4"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
black = "^24.4.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
pre-commit = "^3.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
